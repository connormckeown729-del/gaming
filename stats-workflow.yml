name: Update stats and deploy
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats
        run: python3 fetch_stats.py
        env:
          BRAWLSTARS_TOKEN: ${{ secrets.BRAWLSTARS_TOKEN }}
          CLASH_TOKEN: ${{ secrets.CLASH_TOKEN }}
      - run: mkdir _site && cp index.html style.css app.js stats.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
